<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Project Pad</title>
    <style>
        body { background: #121212; color: #ffffff; padding: 20px; margin: 0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .menu-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        button { background: #2a2a2a; color: #ffffff; border: 1px solid #444; padding: 10px 20px; font-size: 20px; font-family: inherit; cursor: pointer; border-radius: 4px; }
        button:hover { background: #3a3a3a; }
        textarea { flex: 1; width: 100%; background: transparent; color: inherit; font-size: 32px; font-family: inherit; border: none; outline: none; resize: none; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <div class="menu-bar">
        <button onclick="openLocalFile()">Open File</button>
        <button onclick="saveLocalFile()">Save File</button>
    </div>
    <textarea id="editor" placeholder="Type or open a file..."></textarea>

    <script>
        let currentFileHandle = null;

        async function openLocalFile() {
            try {
                const [fileHandle] = await window.showOpenFilePicker();
                const file = await fileHandle.getFile();
                const text = await file.text();
                
                currentFileHandle = fileHandle;
                document.getElementById('editor').value = text;
            } catch (err) {
                console.log('File open cancelled.');
            }
        }

        async function saveLocalFile() {
            try {
                // If no file is open yet, prompt the user where to create and save it
                if (!currentFileHandle) {
                    currentFileHandle = await window.showSaveFilePicker({
                        suggestedName: 'notes.txt'
                    });
                }
                
                const writable = await currentFileHandle.createWritable();
                const text = document.getElementById('editor').value;
                await writable.write(text);
                await writable.close();
                alert('File saved successfully!');
            } catch (err) {
                console.log('File save cancelled or failed.');
            }
        }
    </script>
</body>
</html>
